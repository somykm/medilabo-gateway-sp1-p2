spring.application.name=medilabo-gateway
server.port=8085
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
spring.main.allow-bean-definition-overriding=true
spring.main.web-application-type=servlet
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false
spring.cloud.gateway.server.webmvc.routes[0].id=medilabo-frontend
spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8082
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/ui/**
spring.cloud.gateway.server.webmvc.routes[1].id=medilabo-demographics
spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/patient/**
spring.cloud.gateway.server.webmvc.routes[2].id=medilabo-physicianNotes
spring.cloud.gateway.server.webmvc.routes[2].uri=http://localhost:8083
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/api/history/**
spring.cloud.gateway.server.webmvc.routes[3].id=medilabo-determindiabetes
spring.cloud.gateway.server.webmvc.routes[3].uri=http://localhost:8084
spring.cloud.gateway.server.webmvc.routes[3].predicates[0]=Path=/api/diabetes/**